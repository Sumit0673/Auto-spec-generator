; Minimal pytest configuration for the spec_pipeline test suite.
;
; This is intentionally minimal: the authoritative configuration (coverage
; gate, markers, full addopts) is finalized in pyproject.toml in a later task.
; Only test discovery paths live here so the two configs cannot conflict.
;
; The hypothesis "ci" profile (>= 100 examples per property, per Requirement
; 23.10) is registered and loaded in tests/conftest.py.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: heavier tests that still run in the default suite (e.g. the real Paired_Dataset scan)
