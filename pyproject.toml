[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec_pipeline"
version = "0.1.0"
description = "Five-stage pipeline that generates and verifies CVL specifications for Solidity contracts."
readme = "README.md"
requires-python = ">=3.10,<3.15"

# Runtime dependencies. Every third-party module imported by the spec_pipeline
# and solidity_graph packages is declared here, pinned to one exact version.
#   slither  -> slither-analyzer   (solidity_graph.analyzer, spec_pipeline stage 1)
#   networkx -> networkx           (solidity_graph.analyzer, imported as nx)
#   openai   -> openai             (spec_pipeline.llm_client)
#   pdfplumber -> pdfplumber       (scraper.py audit-report extraction)
# The optional `auto_spec` import in llm_client is guarded by try/except and is
# not a third-party PyPI dependency, so it is intentionally not declared here.
dependencies = [
    "slither-analyzer==0.11.3",
    "networkx==3.4.2",
    "openai==1.99.1",
    "pdfplumber==0.11.7",
]

[project.optional-dependencies]
# Test dependencies, each pinned to one exact version.
test = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "hypothesis==6.135.0",
]

[tool.setuptools]
packages = ["spec_pipeline", "solidity_graph"]

# ---------------------------------------------------------------------------
# Canonical pytest / coverage configuration.
# This supersedes the minimal pytest.ini from task 1.1.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast unit tests",
    "property: hypothesis property-based tests",
    "integration: fixture-backed integration tests",
    "slow: tests that are heavier but still run in the default suite (e.g. the real Paired_Dataset scan)",
]
# Keep hypothesis output visible and its own warnings from failing the run.
filterwarnings = [
    "ignore::hypothesis.errors.NonInteractiveExampleWarning",
]

[tool.coverage.run]
branch = true
source = ["spec_pipeline"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Requirement 10.6: statement coverage floor for spec_pipeline is 80 percent.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.paths]
source = ["spec_pipeline"]
