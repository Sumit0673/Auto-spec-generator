[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-spec"
version = "1.0.0"
description = "Automated CVL Specification Generation for Smart Contracts using RAG and LLM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Auto-Spec Contributors"}
]
keywords = ["certora", "cvl", "formal-verification", "smart-contracts", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.10",
    "flake8>=4.0",
    "mypy>=0.990",
]
gpu = [
    "torch>=2.0.0",
]

[project.scripts]
auto-spec = "auto_spec.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/auto-spec"
Documentation = "https://github.com/yourusername/auto-spec#readme"
Repository = "https://github.com/yourusername/auto-spec.git"
Issues = "https://github.com/yourusername/auto-spec/issues"

[tool.setuptools]
packages = ["auto_spec", "auto_spec.prompts", "auto_spec.utils"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
