name: Release Chroma DB

# Trigger on new version tags like v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        # Need full history for chroma_db
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Get version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version }}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create chroma_db archive
      run: |
        python scripts/create_release.py \
          --version ${{ steps.version.outputs.version }} \
          --output chroma_db_v${{ steps.version.outputs.version }}.tar.gz \
          --metadata
    
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          chroma_db_v${{ steps.version.outputs.version }}.tar.gz
          metadata.json
        body: |
          # Chroma DB Release v${{ steps.version.outputs.version }}
          
          Vector database containing 20+ verified CVL specifications for smart contract verification.
          
          ## Installation
          
          ```bash
          # Extract
          tar -xzf chroma_db_v${{ steps.version.outputs.version }}.tar.gz
          
          # Set environment variable
          export CHROMA_DB_PATH=/path/to/chroma_db
          
          # Or let auto-spec manage it
          export CHROMA_DB_REMOTE_URL=https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/chroma_db_v${{ steps.version.outputs.version }}.tar.gz
          ```
          
          ## Checksum
          
          ```
          See metadata.json for SHA256 checksum
          ```
          
          ## Contents
          
          - 20+ verified CVL specifications
          - Pre-built Chroma vector database
          - BAAI/bge-small-en-v1.5 embeddings
          
          For more information, see [README.md](../README.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to S3 (optional)
      if: vars.S3_BUCKET != ''
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        pip install boto3
        python scripts/upload_to_s3.py \
          --bucket ${{ vars.S3_BUCKET }} \
          --prefix auto-spec-db/v${{ steps.version.outputs.version }} \
          --chroma-path erc20_pairs_final/chroma_db
    
    - name: Update release notes
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # Release v${{ steps.version.outputs.version }}
        
        ## Database
        - **Version**: ${{ steps.version.outputs.version }}
        - **Files**: chroma_db_v${{ steps.version.outputs.version }}.tar.gz
        - **Size**: See metadata.json
        
        ## Download
        - GitHub: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
        - S3: https://${{ vars.S3_BUCKET }}.s3.amazonaws.com/auto-spec-db/v${{ steps.version.outputs.version }}/
        
        ## Usage
        ```bash
        export CHROMA_DB_REMOTE_URL=https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/chroma_db_v${{ steps.version.outputs.version }}.tar.gz
        auto-spec setup
        ```
        EOF
